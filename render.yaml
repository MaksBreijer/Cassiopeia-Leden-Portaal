services:
  - type: web
    name: cassiopeia-webapp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        sync: false
    disks:
      - name: cassiopeia-data
        mountPath: /data
        sizeGB: 1
